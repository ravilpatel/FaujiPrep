<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Defence News &amp; Exam Updates | FaujiPrep</title>
    <meta name="description" content="Daily India-focused defence, armed forces, SSB, CDS and NDA updates curated from PIB and Google News." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://faujiprep.app/news/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="homepage news-page">
    <div id="site-header"></div>
    <main id="main-content">
      <section class="news-hero">
        <div class="container">
          <span class="section-label">Daily intelligence</span>
          <h1>News &amp; Feed</h1>
          <p>India-focused defence, armed-forces and exam updates from PIB and trusted news sources.</p>
          <p class="news-updated" id="news-updated" aria-live="polite">Loading latest updates…</p>
        </div>
      </section>
      <section class="container section news-section">
        <div class="news-controls" aria-label="Filter news">
          <label class="sr-only" for="news-search">Search news</label>
          <input id="news-search" type="search" placeholder="Search updates" autocomplete="off" />
          <label class="sr-only" for="news-category">Filter by category</label>
          <select id="news-category"><option value="">All categories</option></select>
          <label class="sr-only" for="news-source">Filter by source</label>
          <select id="news-source"><option value="">All sources</option></select>
        </div>
        <div class="news-count" id="news-count"></div>
        <div class="news-grid" id="news-list" aria-live="polite"></div>
        <p class="news-empty" id="news-empty" hidden>No matching updates found.</p>
      </section>
    </main>
    <script src="../nav.js"></script>
    <script src="news.js"></script>
  </body>
</html>
