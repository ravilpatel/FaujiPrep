name: Daily news feed

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Kolkata (UTC+05:30)
    - cron: '30 2 * * *'

permissions:
  contents: write

concurrency:
  group: daily-news-feed
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build daily feed and articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate_news.py
      - name: Commit generated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data/news.json news/articles
          git diff --cached --quiet || git commit -m "chore: update daily news feed"
          git push
